<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #4CAF50, #8BC34A);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
}

h2 { color: #4CAF50; }

input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
}

button:hover { background: #388E3C; }

a {
    display: block;
    margin-top: 10px;
    color: #4CAF50;
}

.error {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
    <h2>🌾 Farmer Login</h2>

    <form action="/login_user" method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button>Login</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <a href="/register">New user? Register</a>
</div>

</body>
</html>
